# ==============================================================================
# Mosquitto Broker Configuration — Smart Parking System (PTIT 2026)
# ==============================================================================

# 1. Cổng lắng nghe mạng TCP chuẩn cho ESP32 và Backend
listener 1883 0.0.0.0
protocol mqtt

# 2. Cấu hình kiểm soát truy cập và danh tính
# Bắt buộc xác thực Username/Password, tắt hoàn toàn kết nối ẩn danh
allow_anonymous false
password_file deployment/mosquitto_passwd

# Nạp tệp cấu hình danh sách kiểm soát quyền truy cập Topic (ACL)
acl_file deployment/acl.conf

# 3. Quản lý kết nối & Persistence
persistence true
persistence_location ./data/mosquitto/

# 4. Ghi log hoạt động
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
