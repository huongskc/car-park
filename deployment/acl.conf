# ==============================================================================
# Mosquitto Access Control List (ACL) — Smart Parking System
# Tuân thủ chuẩn cú pháp Mosquitto: chỉ dùng `user`, `topic`, `pattern`
# Cấm kết nối nặc danh; phân quyền nghiêm ngặt theo Username xác thực
# ==============================================================================

# 1. Quyền dành cho Vi điều khiển ESP32 (xác thực theo Username %u = device_id)
# Vi điều khiển chỉ được phép Publish các bản tin thuộc device_id của chính mình
pattern write parking/+/%u/status
pattern write parking/+/%u/telemetry
pattern write parking/+/%u/events/#
pattern write parking/+/%u/ack

pattern write parking/%u/status
pattern write parking/%u/telemetry
pattern write parking/%u/events/#
pattern write parking/%u/ack

# Vi điều khiển chỉ được phép Subscribe/nhận lệnh thuộc device_id của chính mình
pattern read parking/+/%u/commands
pattern read parking/+/%u/config
pattern read parking/%u/commands
pattern read parking/%u/config

# 2. Quyền quản trị toàn cục dành riêng cho Backend Service
# Backend xác thực với username `backend_admin` có toàn quyền điều phối hệ thống
user backend_admin
topic readwrite parking/#
