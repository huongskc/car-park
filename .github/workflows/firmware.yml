name: Firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32
          ldproxy: true
      - name: Create CI-only build values
        run: |
          cat > secrets.env <<'EOF'
          WIFI_SSID=ci-only
          WIFI_PASS=ci-only
          BROKER=mqtt://127.0.0.1:1883
          AUTH_TOKEN=ci-only
          MQTT_PASSWORD=ci-only
          EOF
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --release
      - name: Clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings
